<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="registros.css">
    <title>Reporte Diario de Registros</title>
</head>
<body>
    <div class="report-container">
        <div class="header-report">
            <div>
                <h1>Reporte Diario de Ventas / Registros</h1>
                <div class="fecha-titulo" id="subtituloFecha">Cargando fecha...</div>
            </div>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
        </div>

        <div class="cards-resumen" id="cardsResumen"></div>

        <!-- TABLA 1: CONTEO POR HORA -->
        <h2>Resumen por Hora</h2>
          <table>
              <thead id="theadHoras"></thead>
              <tbody id="tbodyHoras"></tbody>
          </table>

        <!-- TABLA 2: LISTADO COMPLETO DEL DÍA -->
        <h2>Detalle de Registros</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>DNI/C.E/RUC</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Observaciones</th>
                </tr>
            </thead>
            <tbody id="tablaReporte"></tbody>
        </table>
    </div>

    <script src="registros.js"></script>
</body>
</html>
